name: DSH-TUI build

# 编译验证 DSH-TUI 集成分支：源码检查 + 未签名 Standard 调试 APK。
# 大型固定输入包（rootfs/DSH runtime）不入 Git，完整正式打包仍需 ci-package 的资产包；
# 本流程只验证源码可编译，产物为调试签名、不用于分发。
on:
  push:
    branches: [dsh-tui-integration]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dsh-tui-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify toolchain against source configuration
        id: toolchain
        run: python3 tools/ci-toolchain.py --github-output

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ steps.toolchain.outputs.java }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ steps.toolchain.outputs.node }}

      - name: Source contracts and hygiene
        run: |
          python3 tools/prepare-runtime-tools.py --check
          python3 tools/generate-builtin-plugins.py --verify
          python3 tools/generate-credential-paths.py --check
          python3 tools/format-java-tree.py --check
          python3 tools/run-host-tests.py --check-manifest
          python3 tools/check-source-hygiene.py
          python3 tools/check-ui-i18n.py

      - name: Install Android SDK pieces
        run: |
          platform=$(python3 tools/ci-toolchain.py --field androidPlatform)
          buildtools=$(python3 tools/ci-toolchain.py --field buildTools)
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;$platform" "build-tools;$buildtools"
          chmod +x gradlew

      - name: Install Go 1.27.3 and Android NDK for connect-core build
        run: |
          curl -sSL -o /tmp/go.tgz https://go.dev/dl/go1.27.3.linux-amd64.tar.gz
          echo "65efbc80fdc1fa2cd2631cad5b481777a68e8725f34e89f50fc6ac714e379b40  /tmp/go.tgz" | sha256sum -c -
          sudo tar -C /usr/local -xzf /tmp/go.tgz
          echo "/usr/local/go/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.3.11579264"

      # dsha-connect.aar 是 Go/gomobile 构建产物，不入 Git；在 CI 里按 lock 的固定
      # 工具链（go1.27.3 + gomobile pin + NDK 26.3）从源码重建，并与 lock 的 sha256
      # 核对一致后才进入 gradle 编译 —— 与官方审计构建同一约束。
      - name: Build dsha-connect.aar from pinned sources
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/26.3.11579264"
          export GOPATH="$PWD/.gopath" GOCACHE="$PWD/.gocache" GOTOOLCHAIN=local CGO_ENABLED=1
          go version
          cd tools/remote/connect-core
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20261011034528-197770444867
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20261011034528-197770444867
          "$GOPATH/bin/gomobile" init
          "$GOPATH/bin/gomobile" bind -target=android/arm64 -androidapi=30             -javapkg=com.deepseekharness.connect -trimpath             -ldflags='-s -w -buildid= -checklinkname=0 -extldflags=-Wl,-z,max-page-size=16384'             -o ../../..//app/libs/dsha-connect.aar ./mobile
          cd ../../..
          python3 tools/remote/verify-android-runtime.py

      # 大型 rootfs/DSH 运行时档仍不入 Git；source-only 单测+编译验证（含 TuiManagerTest）。
      - name: Source-only unit tests and Java compilation (Standard)
        run: >
          ./gradlew :app:testStandardDebugUnitTest :app:compileStandardDebugJavaWithJavac
          -Pdsha.sourceOnlyTests=true
          -x :app:prepareStandardAssets -x :app:prepareRecoveryAssets
          --no-daemon --max-workers=2

      - name: Report test scope
        if: always()
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          reports = list(Path("app/build/test-results/testStandardDebugUnitTest").glob("TEST-*.xml"))
          if not reports:
              print("no JUnit reports; execution not established")
              raise SystemExit(1)
          totals = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
          for report in reports:
              s = ET.parse(report).getroot()
              for k in totals:
                  totals[k] += int(s.get(k, 0))
          print("Standard unit tests:", totals)
          if totals["failures"] or totals["errors"]:
              raise SystemExit(1)
          PY
