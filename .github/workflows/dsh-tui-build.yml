name: DSH-TUI build

# 编译验证 DSH-TUI 集成分支：源码检查 + 未签名 Standard 调试 APK。
# 大型固定输入包（rootfs/DSH runtime）不入 Git，完整正式打包仍需 ci-package 的资产包；
# 本流程只验证源码可编译，产物为调试签名、不用于分发。
on:
  push:
    branches: [dsh-tui-integration]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dsh-tui-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify toolchain against source configuration
        id: toolchain
        run: python3 tools/ci-toolchain.py --github-output

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ steps.toolchain.outputs.java }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ steps.toolchain.outputs.node }}

      - name: Source contracts and hygiene
        run: |
          python3 tools/prepare-runtime-tools.py --check
          python3 tools/generate-builtin-plugins.py --verify
          python3 tools/generate-credential-paths.py --check
          python3 tools/format-java-tree.py --check
          python3 tools/run-host-tests.py --check-manifest
          python3 tools/check-source-hygiene.py
          python3 tools/check-ui-i18n.py

      - name: Install Android SDK pieces
        run: |
          platform=$(python3 tools/ci-toolchain.py --field androidPlatform)
          buildtools=$(python3 tools/ci-toolchain.py --field buildTools)
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;$platform" "build-tools;$buildtools"
          chmod +x gradlew

      # 大型固定输入档（dsh-runtime.bin/offline-rootfs.bin 等）不入 Git，完整 APK 打包
      # 需要 ci-package 的资产包；本分支用与上游 ci-fast 相同的 source-only 目标验证
      # 源码可编译、单测通过（含新增 TuiManagerTest）。
      - name: Source-only unit tests and Java compilation (Standard)
        run: >
          ./gradlew :app:testStandardDebugUnitTest :app:compileStandardDebugJavaWithJavac
          -Pdsha.sourceOnlyTests=true
          -x :app:prepareStandardAssets -x :app:prepareRecoveryAssets -x :app:verifyRemoteTransport
          --no-daemon --max-workers=2

      - name: Report test scope
        if: always()
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          reports = list(Path("app/build/test-results/testStandardDebugUnitTest").glob("TEST-*.xml"))
          if not reports:
              print("no JUnit reports; execution not established")
              raise SystemExit(1)
          totals = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
          for report in reports:
              s = ET.parse(report).getroot()
              for k in totals:
                  totals[k] += int(s.get(k, 0))
          print("Standard unit tests:", totals)
          if totals["failures"] or totals["errors"]:
              raise SystemExit(1)
          PY
