services:
  relay:
    build:
      context: .
      dockerfile: Dockerfile
    image: dsha-relay:verified-local
    # Linux host networking keeps plaintext HTTP/WS bound to loopback. The
    # existing TLS reverse proxy reaches it without publishing plaintext ports.
    network_mode: host
    user: "65532:65532"
    read_only: true
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 512m
    cpus: 2
    volumes:
      - /etc/dsha-relay/config.json:/etc/dsha-relay/config.json:ro
      - /var/lib/dsha-relay/identity.key:/var/lib/dsha-relay/identity.key:ro
